<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>WorldSim 推流画面 · 名场面：天台告白</title>
<style>
  :root{
    --bg0:#0E1116; --border:#2D333D;
    --text0:#E6E9EF; --text1:#9AA4B2;
    --accent:#5AC3ED; --positive:#2EFA8D; --warn:#FEAE3E; --neutral:#8A93A0; --director:#BF86E8;
    --c-zhouxu:#5583C9; --c-suman:#EB6999;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#05070A}
  body{font-family:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text0)}
  .phone{position:relative;width:390px;height:844px;margin:0 auto;overflow:hidden;background:var(--bg0)}

  /* ---------- 全幅演出画面 ---------- */
  .stage{position:absolute;inset:0}
  .stage svg{display:block;width:390px;height:844px}
  .scrim-top{position:absolute;top:0;left:0;right:0;height:110px;pointer-events:none;
    background:linear-gradient(180deg,rgba(14,17,22,.5),rgba(14,17,22,0))}
  .warm-filter{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 320px 300px at 195px 430px, rgba(244,167,185,.17), rgba(244,167,185,.05) 55%, rgba(244,167,185,0) 78%),
               radial-gradient(ellipse 700px 900px at 195px 380px, rgba(244,167,185,0) 55%, rgba(14,17,22,.28) 100%)}

  /* ---------- 画面内小标签：左上 地点+模拟时间 ---------- */
  .tag-tl{position:absolute;top:12px;left:12px;z-index:20;display:flex;align-items:center;gap:5px;
    background:rgba(8,10,14,.62);border:1px solid rgba(45,51,61,.9);border-radius:10px;
    padding:4px 9px;font-size:10px;color:var(--text1);white-space:nowrap}
  .tag-tl svg{width:10px;height:10px;stroke:var(--accent);flex:none}
  .tag-tl b{color:var(--text0);font-weight:600}

  /* ---------- 右上 AI 生成内容水印（内容侧合规） ---------- */
  .ai-wm{position:absolute;top:12px;right:12px;z-index:20;display:flex;align-items:center;gap:4px;
    background:rgba(254,174,62,.10);border:1px solid rgba(254,174,62,.6);border-radius:10px;
    padding:4px 8px}
  .ai-wm svg{width:10px;height:10px;stroke:var(--warn)}
  .ai-wm span{font-size:10px;font-weight:700;color:var(--warn);white-space:nowrap}

  /* ---------- 名场面标签 ---------- */
  .tag-climax{position:absolute;top:46px;left:12px;z-index:20;display:flex;align-items:center;gap:4px;
    background:rgba(191,134,232,.14);border:1px solid rgba(191,134,232,.55);border-radius:10px;
    padding:4px 9px;font-size:10px;font-weight:700;color:var(--director);white-space:nowrap}
  .tag-climax svg{width:10px;height:10px;stroke:var(--director)}

  /* ---------- 飘屏致谢：礼物（画面内元素，非平台按钮） ---------- */
  .gift-float{position:absolute;top:76px;right:12px;z-index:22;width:192px;
    background:rgba(22,27,34,.92);border:1px solid rgba(90,195,237,.5);border-radius:10px;
    padding:7px 9px;box-shadow:0 2px 12px rgba(90,195,237,.18)}
  .gf-row1{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text0)}
  .gf-row1 svg{width:13px;height:13px;stroke:var(--warn);flex:none}
  .gf-row1 b{color:var(--warn)}
  .gf-row1 .gx{margin-left:auto;color:var(--text1);font-size:10px;flex:none}
  .gf-row2{margin-top:4px;display:flex;align-items:center;gap:4px;font-size:10px;color:var(--accent);font-weight:600}
  .gf-row2 svg{width:10px;height:10px;stroke:var(--accent);flex:none}

  /* ---------- 人物特写卡（可复用结构，Web 端同 class 参考） ---------- */
  .pcard{--sig:#C3CDDA;--sigtext:#10141B;position:absolute;width:120px;padding:7px 7px 10px;
    background:#161B22;border:2px solid var(--sig);border-radius:14px;
    box-shadow:0 4px 16px rgba(0,0,0,.45),0 0 12px color-mix(in srgb,var(--sig) 32%,transparent);
    animation:pcard-in .45s ease-out both}
  .pcard img{display:block;width:100%;aspect-ratio:1/1;border-radius:9px;background:#1F2630}
  .pcard figcaption{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
    background:var(--sig);color:var(--sigtext);font-size:11px;font-weight:700;
    padding:2px 12px;border-radius:9px;white-space:nowrap;
    border:2px solid rgba(14,17,22,.9)}
  @keyframes pcard-in{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
  /* VN 式双人位：当前说话人在前，另一人错位缩小退后 */
  .pstack{position:absolute;left:12px;top:86px;z-index:21}
  .pstack .pcard-front{left:0;top:0;width:120px;z-index:2;
    box-shadow:0 4px 18px rgba(0,0,0,.5),0 0 16px color-mix(in srgb,var(--sig) 45%,transparent)}
  .pstack .pcard-back{left:96px;top:44px;width:84px;z-index:1;filter:opacity(.6) saturate(.85);
    animation-delay:.15s}
  .pstack .pcard-back figcaption{font-size:9px;padding:1px 8px;bottom:-7px}

  /* ---------- 字幕条（避开底部 220px 平台安全区） ---------- */
  .subtitle{position:absolute;left:12px;right:12px;bottom:228px;z-index:25;
    display:flex;align-items:stretch;
    background:rgba(8,10,14,.68);border:1px solid rgba(235,105,153,.45);
    border-radius:10px;overflow:hidden}
  .sub-chip{flex:none;width:48px;display:flex;align-items:center;justify-content:center;background:var(--c-suman)}
  .sub-chip span{font-size:13px;font-weight:700;color:#FFF}
  .sub-body{flex:1;padding:8px 11px 7px}
  .sub-text{font-size:16px;font-weight:700;line-height:1.42;color:#FFF;
    text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.5)}
  .sub-meta{margin-top:3px;font-size:9px;color:var(--text1);display:flex;align-items:center;gap:4px}
  .sub-meta .dotp{width:5px;height:5px;border-radius:50%;background:var(--c-suman)}
  .sub-meta .pos{color:var(--positive);font-weight:700}
</style>
</head>
