# T-ART-03 生产 nginx 直托片段（06 §7 B8：03 §8.1 拓扑扩展；开发期由 obs-api 挂载等价路径）。
# 本机无 nginx，未跑 `nginx -t`（06 §6 R5 登记）；M6 上线准备时实机复核。
# 使用：include 进 server{} 块；ROOT 指仓根。

location /assets/ {
    alias ROOT/ui/assets/;
    # 静态资产长缓存（带 hash 资源可升 immutable；现 manifest.json 等无 hash，保守短缓存）
    add_header Cache-Control "public, max-age=300";
}

location /stream/ {
    alias ROOT/stream/;
    index index.html;
    # html 不缓存（03 §8.1 口径），静态资源默认
    location ~* \.html$ {
        alias ROOT/stream/;
        add_header Cache-Control "no-cache";
    }
}

location = /map_layout.json {
    alias ROOT/web/public/map_layout.json;
    default_type application/json;
    add_header Cache-Control "no-cache";
}
