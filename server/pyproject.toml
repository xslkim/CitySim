[project]
name = "worldsim"
version = "0.1.0"
description = "WorldSim kernel + LLM gateway + ingest/observe APIs (04 §2.1)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg==0.30.0",
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "httpx==0.28.1",
    "pyyaml==6.0.2",
    "pydantic==2.10.4",
    "sentence-transformers>=6.1.0",
    "jsonschema>=4.26.0",
    "websockets==14.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "pytest-socket==0.7.0",
    "tiktoken==0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldsim"]

[tool.pytest.ini_options]
# pytest import 模式钉版（配合"测试文件 basename 全库唯一"纪律，00 §7 DoD 7 / round2 §A.3）
# live 标记：真 LLM 联网用例（T-LLM-03 起），默认 deselect，显式 `-m live` 才跑
addopts = "--import-mode=importlib -m 'not live'"
markers = [
    "live: 真 LLM 联网冒烟（默认跳过；cd server && uv run pytest -m live 显式跑）",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
