# LLM 网关全部配置的唯一载体（04 §8 / §12.4 热更；阈值集中 thresholds: 段）
# 四段键名 providers/task_routes/generation_params/thresholds 为全项目冻结口径（01 文档 T-CFG-02，03 T-LLM-04 以此对齐）
# 密钥不进本文件：只写 api_key_env 变量名（04 §11.2）；付费档价格一律 null + placeholder_pending_w2（§5 R1/R4）

providers:
  zhipu:                                        # 智谱 GLM 主供（00 §1 A3）
    type: openai_compatible
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: WSIM_ZHIPU_API_KEY
    chat:
      - id: glm-4.5-flash                       # 免费档·主用（00 §1 A9 实测）：明星/深度反思/导演/世界文案档
        tier: free
        reasoning: true                         # reasoning 模型：响应只取 content 字段（provider 实现归 03）
        thinking: disabled                      # 开发期关 reasoning（03 §6 D44：实测 2026-09-25 延迟 50s→2s、配额消耗 ~12 倍→1×）
        rpm_limit: 30                           # 实测（2026-09-25，T-LLM-12，§5 R2 收口）：并发上限≈2（超出即 429 码1302），桶保守取 30
        concurrency: 2                          # 在飞并发闸（实测并发 2 全过、并发 3 触发 1302）
        p95_trip_ms: 15000                      # 撞墙条件③条目级阈（03 §6 D42；thinking disabled 后实测 ~2s）
        input_price: 0                          # 免费档实测 ¥0（2026-09-25，T-LLM-12，§5 R1 收口）
        output_price: 0
        price_status: measured_free_tier_w2
      - id: glm-4-flash                         # 免费档（00 §1 A9 实测）：次要/背景摘要/安全档
        tier: free
        reasoning: false
        rpm_limit: 60                           # 实测（2026-09-25）：并发 10 全过、间隔 2s 顺序连发无 429
        concurrency: 5
        p95_trip_ms: 15000                      # 撞墙条件③条目级阈（03 §6 D42）；实测 p50≈1s，留足头部空间
        input_price: 0
        output_price: 0
        price_status: measured_free_tier_w2
      # 付费档占位：充值后仅改配置升档（00 §1 A9）；型号 id 开工当天按官方文档核实填入（04 §8.1）
      # - id: glm-4.5-air                       # 付费档候选（2026-09-23 实测 1113 余额不足，00 §1 附）
      #   tier: paid
      #   enabled: false
      #   input_price: null
      #   output_price: null
      #   price_status: placeholder_pending_w2
    embedding:
      - id: embedding-3                         # 备选档（00 §1 A10）：充值后切换（WSIM_EMBED_BACKEND=cloud）
        enabled: false
        input_price: null
        price_status: placeholder_pending_w2

  local_embed:                                  # 本地 bge-m3（sentence-transformers 封装，00 §1 A10 定案）
    type: sentence_transformers
    model: BAAI/bge-m3
    dimensions: 1024                            # 与 04 §5.2 memories.embedding vector(1024) 一致
    # GPU 与图像生成错峰、CPU 可兜底（00 §1 A10）
    input_price: 0                              # 本地模型记 0、记耗时归账 GPU 预算（04 §8.3）

  local_vllm:                                   # 本地 vLLM 三端点占位（04 §1.6 默认值）
    enabled: false                              # 整体 defer 上线部署期（00 §1 A3 改注；M6 不含 vLLM）
    type: openai_compatible
    endpoints:
      safety: http://127.0.0.1:8101/v1          # Qwen3-4B 内容安全初筛
      fallback: http://127.0.0.1:8102/v1        # Qwen3-8B 次要层兜底
      embed: http://127.0.0.1:8103/v1           # bge-m3 embedding

task_routes:                                    # 04 §8.1 全部 9 个 task_type（含 world_copy，与 04 §5.2 llm_calls 注释同口径）
  star_decision:
    primary: { provider: zhipu, model: glm-4.5-flash }
    fallback:                                   # 04 §8.1：重试3次→GLM 付费档→暂停时钟
      - { provider: zhipu, model: glm-4.5-air, enabled: false }   # 付费档占位，充值后启用（00 §1 A9）
      - pause_clock
  dialogue:
    primary: { provider: zhipu, model: glm-4.5-flash }
    fallback:
      - { provider: zhipu, model: glm-4.5-air, enabled: false }
      - pause_clock
  reflection:                                   # 深度反思用明星层模型（04 §7.2）
    primary: { provider: zhipu, model: glm-4.5-flash }
    fallback:
      - { provider: zhipu, model: glm-4.5-air, enabled: false }
      - pause_clock
  secondary:
    primary: { provider: zhipu, model: glm-4-flash }
    fallback:                                   # 撞墙→本地 8B（04 §8.2 三条撞墙判定）；vLLM defer 上线部署期
      - { provider: local_vllm, model: qwen3-8b, enabled: false }
  bgsummary:
    primary: { provider: zhipu, model: glm-4-flash }
    fallback:
      - { provider: local_vllm, model: qwen3-8b, enabled: false }
  director:
    primary: { provider: zhipu, model: glm-4.5-flash }
    fallback: [ queue_retry ]                   # 失败→任务排队延后，不降级换模型保文风（04 §8.1）
  world_copy:
    primary: { provider: zhipu, model: glm-4.5-flash }
    fallback: [ queue_retry ]
  safety:
    primary: { provider: zhipu, model: glm-4-flash }   # 开发期口径（04 §8.1 本地 Qwen3-4B 常驻随 vLLM defer）
    fallback: [ pause_publish_channel ]         # 无降级换模型：故障=暂停发布通道，内核照跑（04 §8.1）
  embed:
    primary: { provider: local_embed, model: BAAI/bge-m3 }
    fallback:                                   # GPU 忙→云端批量（WSIM_EMBED_BACKEND=cloud，04 §8.1）
      - { provider: zhipu, model: embedding-3, enabled: false }

generation_params:                              # 04 §8.6 逐行照抄（7 行）为设计镜像；glm-4.5-flash 行 max_tokens 实测放大（D40）
  star_decision: { temperature: 0.8, max_tokens: 2000, response_format: json }   # 设计镜像 400；reasoning 实测正文前耗 ~600 token（D40，T-LLM-12）
  dialogue:      { temperature: 0.9, max_tokens: 6000, presence_penalty: 0.3 }   # 设计镜像 1200；台词反套路（配合 04 §10.2 n-gram 指标）；reasoning 预留（D40）
  secondary:     { temperature: 0.7, max_tokens: 250, response_format: json }
  bgsummary:     { temperature: 0.3, max_tokens: 300, response_format: json }
  reflection:    { temperature: 0.6, max_tokens: 3000 }                          # 设计镜像 500；reasoning 预留（D40）
  director:      { temperature: 1.0, max_tokens: 8000 }                          # 设计镜像 2000；上下文内带弧线状态机全量；reasoning 预留（D40）
  safety:        { temperature: 0.0, max_tokens: 50 }                            # 分类标签输出

thresholds:                                     # 阈值集中段（04 §12.4）；数字引用持有方，不新造
  retrieval_quota: { N: 10, M: 5, K: 10 }       # 配额制检索（04 §7.1）
  rotation: { promote_in: 0.62, demote_out: 0.45 }  # 明星轮换滞回带（04 §4.2）
  lod:                                    # LOD 调度阈值（04 §4.2 镜像；路径一权重为设计未定值的等权初值，02 文档 D4）
    secondary_cap: 16                     # secondary 层总人数硬上限（评审二轮 N-P1-7，04 §4.2）
    cooldown_demote_sim_days: 2           # 事件驱动升入 secondary 连续 2 模拟日零新交互 → 回落（04 §4.2）
    star_count: 8                         # 明星层席位数（06 §3 LOD 三层，源方案 §3.2 持有）
    daily_churn_cap: 2                    # 路径一每模拟日最多变动 2 人（04 §4.2）
    consecutive_over: 2                   # 升星迟滞：连续得分超 PROMOTE_IN 次数（04 §4.2）
    consecutive_under: 3                  # 降星迟滞：连续得分低于 DEMOTE_OUT 次数（04 §4.2）
    weights: { w_arc: 1.0, w_dir: 1.0, w_int: 1.0, w_cold: 1.0 }   # 路径一 score 四因子等权初值（设计未给，02 D4）
    gini_cold_bonus_above: 0.45           # 出场基尼超预警线时 cold_bonus 权重上调 ×2（阈值持有方 = 01 §9 预警线，02 D23）
  reflection: { importance_acc: 20 }            # 反思触发阈值（04 §7.2）
  dialogue: { daily_cap: 42 }                   # 每模拟日对话场次上限默认值（未降速时；降速档 ×60%，04 §8.4 ③；值 = 01 §1.6 推算区间上界的工程默认，02 D29）
  cost_breaker: { alarm_ratio: 1.5, throttle_ratio: 2.0, recover_ratio: 1.3 }   # 熔断倍数（数值持有方 = 源方案 §5.2，06 §3 登记；04 §8.4 镜像；恢复行"回落 <1.3× 逐级撤销"）
  intervention_rate_cap: 0.15                   # 干预率上限（数值持有方 = 源方案 §4.8，06 §3 登记；消费方 = 04 T-DIR-03 滑窗 / 08 T-AUD-05 审计④，本段唯一写入方）
