  - { id: G-SOC-02, category: 社交, text: 组织一次 4 人以上饭局, difficulty: 中, weight: 4, persona_bias: "E++",
      check: { tier: P1, kind: manual, note: 邀约成功且到场 ≥4 } }
  - { id: G-SOC-03, category: 社交, text: 修复一段紧张关系, difficulty: 中, weight: 5, persona_bias: "A+",
      check: { tier: P1, kind: manual, note: 任一 tension>40 边降 10 } }
