# goals.yaml —— 周目标库 36 条（01 §3.3 逐字镜像；数字唯一持有方 = 01 §3.3，勿改数字，修订先回改 01）
# 载体定名 = 02 文档 T-REL-03 交付物（已入 00 §2 配置清单）
# 权重 = 被抽中先验，按人格加权（整表 P1，W4 前校准）；check.tier: P0 = M1 可编程完成判定子集，P1 = 预留（02 文档 D9）

meta:
  count: 36
  refresh: 每周日晚                  # 批量刷新时点（01 §3.3）
  active_per_tier: { star: 3, secondary: 2, background: 1 }   # 每 Agent 活跃周目标数按层（01 §3.3）

frustration_rules:                   # 受阻与挫败规则（01 §3.3 硬数字逐行）
  block_increment: 1                 # 每次指向该目标的意图被拦截/拒绝/爽约，受阻计数 +1
  frustration_trigger_blocks: 3      # 同一目标受阻 3 次 → 挫败事件（M1 口径：恰在第 3 次触发一次，D18）
  frustration_mood_delta: -12        # 挫败事件：情绪 -12
  frustration_gain: 10               # 挫败值 +10
  weekly_fail_blocked_min: 2         # 周日晚结算未完成且受阻 ≥2 → 挫败值 +8
  weekly_fail_blocked_gain: 8
  weekly_fail_idle_gain: 4           # 未受阻（纯没做）→ +4
  grudge_threshold: 30               # 迁怒：挫败值 ≥30 → 对最大 blocker affinity -6、tension +8，
  grudge_affinity_delta: -6          #   且未来 48h 对其 argue/gossip 权重 ×3（权重倍乘经 T-REL-04 接口）
  grudge_tension_delta: 8
  replan_threshold: 50               # 换策略：挫败值 ≥50 → 目标降级改写 + 生成一次反思
  abandon_threshold: 80              # 放弃：挫败值 ≥80 → 放弃目标 + 深度反思（重要性 ≥8）+ 挫败值清零至 20
  abandon_reset_to: 20
  abandon_reflection_importance: 8
  daily_recovery: 4                  # 挫败值自然恢复每模拟日 -4
  a_level_recovery: 10               # A 级正向事件额外 -10（M1 无 grade 初值打分，接口预留 T-ADJ-07）

goals:                               # 36 条逐字按 01 §3.3 周目标库表
