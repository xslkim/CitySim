# topics.yaml —— 话题库 ≥60 条（01 §7 话题库规模行逐字镜像；数字唯一持有方 = 01 §7，勿改数字，修订先回改 01）
# 6 类配比：日常 12 / 工作 12 / 八卦 10 / 情感 10 / 秘密 8 / 冲突 8（合计 60 ≥60）
# topic_id 形态 = 工程默认（T-<类码>-nn，02 文档偏差表 D21）；每条带 topic_id/分类/引用模板
# 八卦类 = 动态引用 gossip 记忆条目的种子模板（dynamic: gossip；{gossip} 槽由 T-MEM-01 检索供数，T-ADJ-04 注入）

meta:
  total_min: 60
  category_counts: { 日常: 12, 工作: 12, 八卦: 10, 情感: 10, 秘密: 8, 冲突: 8 }   # 01 §7 话题库规模行配比
  per_dialogue: [1, 2]                    # 每场对话 1~2 个话题（01 §7 话题系统行）

rules:                                    # 解锁与权重/去重冷却（01 §7 话题系统行逐行）
  deep_unlock_affinity: 20                # 情感类 affinity≥20 解锁
  secret_unlock_affinity: 60              # 秘密类 affinity≥60 且一方主动
  conflict_tension_threshold: 30          # 冲突类 tension≥30 时
  conflict_weight_factor: 3               #   权重 ×3
  cooldown_hours: 72                      # 同一 Agent 同一 topic_id 冷却 72h = 72 模拟小时（02 D11 口径）
  affinity_direction: max                 # 双向 affinity/tension 取大值判定（工程默认，D21）

topics:
  # —— 日常 12（天气/外卖/快递/睡眠/通勤/房租/健身/厨艺/剧集/游戏/周末计划/宠物）——
  - { topic_id: T-DAY-01, category: 日常, title: 天气, template: "今天这天气也太{weather}了，你出门没带伞吧？" }
  - { topic_id: T-DAY-02, category: 日常, title: 外卖, template: "你中午又点的那家外卖？我上次吃拉肚子了。" }
  - { topic_id: T-DAY-03, category: 日常, title: 快递, template: "楼下快递柜又满了，你有件堵在那儿吗？" }
  - { topic_id: T-DAY-04, category: 日常, title: 睡眠, template: "你昨晚几点睡的？我看你黑眼圈都出来了。" }
  - { topic_id: T-DAY-05, category: 日常, title: 通勤, template: "今早地铁挤死了，你上班路上顺吗？" }
  - { topic_id: T-DAY-06, category: 日常, title: 房租, template: "听说房东又要涨租了，你一个月房租多少来着？" }
  - { topic_id: T-DAY-07, category: 日常, title: 健身, template: "健身房最近人少了不少，你还坚持去吗？" }
  - { topic_id: T-DAY-08, category: 日常, title: 厨艺, template: "你上次做的那个菜绝了，什么时候再露一手？" }
  - { topic_id: T-DAY-09, category: 日常, title: 剧集, template: "最近那部剧你追到第几集了？别给我剧透啊。" }
  - { topic_id: T-DAY-10, category: 日常, title: 游戏, template: "那款游戏新赛季开了，你上分了吗？" }
  - { topic_id: T-DAY-11, category: 日常, title: 周末计划, template: "这周末有什么安排？要不要一起出去走走？" }
  - { topic_id: T-DAY-12, category: 日常, title: 宠物, template: "楼下那只橘猫又胖了，你说谁一直在喂它？" }
