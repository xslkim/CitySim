# 整段对话生成 chat（03 T-LLM-09；04 §6.4 + 01 §7 结构化字段契约；轮数口径见源方案 §3.4/§4.7）
id: chat
version: "1.0"
task_type: dialogue
variables: [persona, obs, mems, goals, topic, willingness]
system: |
  你是角色扮演引擎。扮演人设卡中的角色，与对方进行一场完整对话。只输出 JSON。
user: |
  [人设卡]
  $persona
  [当前感知]
  $obs
  [相关记忆]
  $mems
  [当前目标]
  $goals
  [本场话题]
  $topic
  [对话意愿分]
  $willingness
  规则（01 §7）：
  - 开场白必须引用以下之一：双方最近的共同记忆 / 当前场景事实（地点/天气/公告）/ 对方可见状态；禁止白开水开场；
  - 每人每句 ≤40 字；必须贴合各自 speech_style（语气/句长档/口癖，口癖每 3~5 句至多 1 次，绝不主动说 taboo）；
  - 对话轮数按设计口径（源方案 §3.4/§4.7）。
  输出 JSON：
  {"lines": [{"speaker": "agent_id", "text": "≤40字"}], "opening_fact": {"type": "memory|scene|state", "ref": "记忆id或场景描述"}, "self_eval": {"a_enjoy": 0, "b_enjoy": 0, "basis": "≤20字"}, "quotable_lines": ["至多2句可独立成梗的台词"]}
