<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" role="img" aria-label="404 公寓天台夜景">
  <!-- T-LTV-05 舞台底图 climax 形态：原型 stream-climax.html 剥离叙事元素（角色/气泡/爱心/连线）后的
       天台夜景（06 §7 B5）；全部 HEX ∈ ui/assets/palette/allowed_hex.txt -->
  <defs>
    <linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1116"/><stop offset=".6" stop-color="#1F2630"/><stop offset="1" stop-color="#3B3A55"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3A45"/><stop offset="1" stop-color="#0E1116"/>
    </linearGradient>
  </defs>

  <!-- ===== 夜空（月色层次） ===== -->
  <rect x="0" y="0" width="390" height="310" fill="url(#nsky)"/>
  <g fill="#E6E9EF">
    <circle cx="26" cy="30" r="1.2" opacity=".8"/><circle cx="64" cy="86" r="1" opacity=".5"/>
    <circle cx="98" cy="20" r="1.3" opacity=".9"/><circle cx="140" cy="56" r="1" opacity=".5"/>
    <circle cx="176" cy="116" r="1.2" opacity=".6"/><circle cx="206" cy="26" r="1" opacity=".7"/>
    <circle cx="238" cy="88" r="1.3" opacity=".5"/><circle cx="262" cy="34" r="1" opacity=".8"/>
    <circle cx="296" cy="150" r="1.1" opacity=".5"/><circle cx="366" cy="140" r="1.2" opacity=".7"/>
    <circle cx="120" cy="150" r="1" opacity=".4"/><circle cx="52" cy="130" r="1.1" opacity=".5"/>
    <circle cx="352" cy="24" r="1" opacity=".6"/><circle cx="20" cy="170" r="1" opacity=".4"/>
    <circle cx="160" cy="180" r="1" opacity=".35"/><circle cx="220" cy="196" r="1.2" opacity=".4"/>
  </g>
  <!-- 流星 -->
  <line x1="58" y1="42" x2="96" y2="60" stroke="#E6E9EF" stroke-width="1.2" opacity=".45" stroke-linecap="round"/>
  <circle cx="58" cy="42" r="1.6" fill="#E6E9EF" opacity=".7"/>
  <!-- 月亮 + 月晕 -->
  <circle cx="330" cy="168" r="44" fill="#F2E6D4" opacity=".05"/>
  <circle cx="330" cy="168" r="31" fill="#F2E6D4" opacity=".12"/>
  <circle cx="330" cy="168" r="21" fill="#F2E6D4"/>
  <circle cx="324" cy="162" r="3.6" fill="#D9B48F" opacity=".7"/><circle cx="336" cy="174" r="2.5" fill="#D9B48F" opacity=".6"/><circle cx="332" cy="158" r="1.6" fill="#D9B48F" opacity=".7"/>
  <!-- 云 -->
  <g fill="#1F2630" opacity=".78">
    <rect x="170" y="50" width="120" height="18" rx="9"/>
    <rect x="20" y="142" width="150" height="20" rx="10"/>
    <rect x="216" y="112" width="104" height="15" rx="7.5"/>
    <rect x="60" y="196" width="130" height="16" rx="8" opacity=".6"/>
  </g>

  <!-- ===== 城市天际线 ===== -->
  <g>
    <rect x="0" y="252" width="52" height="100" fill="#0E1116"/>
    <rect x="57" y="226" width="44" height="126" fill="#161B22"/>
    <rect x="106" y="268" width="50" height="84" fill="#0E1116"/>
    <rect x="161" y="240" width="48" height="112" fill="#161B22"/>
    <rect x="214" y="278" width="46" height="74" fill="#0E1116"/>
    <rect x="266" y="244" width="48" height="108" fill="#161B22"/>
    <rect x="320" y="262" width="70" height="90" fill="#0E1116"/>
    <g fill="#FFD166">
      <rect x="10" y="264" width="5" height="7" opacity=".45"/><rect x="30" y="282" width="5" height="7" opacity=".3"/>
      <rect x="66" y="240" width="5" height="7" opacity=".5"/><rect x="84" y="258" width="5" height="7" opacity=".3"/>
      <rect x="66" y="282" width="5" height="7" opacity=".35"/><rect x="116" y="280" width="5" height="7" opacity=".4"/>
      <rect x="172" y="254" width="5" height="7" opacity=".5"/><rect x="190" y="274" width="5" height="7" opacity=".3"/>
      <rect x="226" y="290" width="5" height="7" opacity=".4"/><rect x="276" y="256" width="5" height="7" opacity=".5"/>
      <rect x="296" y="276" width="5" height="7" opacity=".3"/><rect x="332" y="274" width="5" height="7" opacity=".45"/>
      <rect x="358" y="290" width="5" height="7" opacity=".3"/><rect x="140" y="292" width="5" height="7" opacity=".35"/>
    </g>
  </g>

  <!-- ===== 天台地面与护栏 ===== -->
  <rect x="0" y="378" width="390" height="466" fill="url(#roof)"/>
  <g stroke="#1F2630" stroke-width="1.5">
    <line x1="0" y1="440" x2="390" y2="440"/><line x1="0" y1="510" x2="390" y2="510"/>
    <line x1="0" y1="590" x2="390" y2="590"/><line x1="0" y1="680" x2="390" y2="680"/>
    <line x1="0" y1="780" x2="390" y2="780"/>
  </g>
  <rect x="0" y="350" width="390" height="28" fill="#2D333D"/>
  <rect x="0" y="350" width="390" height="2.5" fill="#5B7B9A" opacity=".7"/>
  <rect x="0" y="334" width="390" height="4" fill="#2D333D"/>
  <g fill="#2D333D">
    <rect x="18" y="334" width="3" height="16"/><rect x="58" y="334" width="3" height="16"/>
    <rect x="98" y="334" width="3" height="16"/><rect x="138" y="334" width="3" height="16"/>
    <rect x="178" y="334" width="3" height="16"/><rect x="218" y="334" width="3" height="16"/>
    <rect x="258" y="334" width="3" height="16"/><rect x="298" y="334" width="3" height="16"/>
    <rect x="338" y="334" width="3" height="16"/><rect x="372" y="334" width="3" height="16"/>
  </g>
  <!-- 地面光晕：月色 + 暖光 -->
  <ellipse cx="320" cy="620" rx="120" ry="34" fill="#F2E6D4" opacity=".045"/>
  <ellipse cx="210" cy="540" rx="130" ry="40" fill="#FFD166" opacity=".05"/>

  <!-- 楼梯间小屋 -->
  <rect x="0" y="286" width="74" height="92" fill="#4A5A6A" stroke="#2E3A45" stroke-width="2"/>
  <rect x="0" y="280" width="80" height="8" fill="#2E3A45"/>
  <rect x="30" y="326" width="30" height="52" rx="2" fill="#1F2630"/>
  <circle cx="55" cy="354" r="2" fill="#8A93A0"/>
  <rect x="10" y="300" width="18" height="16" fill="#FFD166" opacity=".5"/>

  <!-- 晾衣架 -->
  <rect x="96" y="330" width="4" height="72" fill="#2D333D"/>
  <rect x="168" y="330" width="4" height="72" fill="#2D333D"/>
  <line x1="98" y1="337" x2="170" y2="337" stroke="#8A93A0" stroke-width="1.5"/>
  <rect x="106" y="337" width="17" height="28" rx="2" fill="#C9D2DA" opacity=".92"/>
  <rect x="129" y="337" width="15" height="22" rx="2" fill="#EB6999" opacity=".85"/>
  <rect x="150" y="337" width="11" height="15" rx="2" fill="#F2E6D4" opacity=".9"/>

  <!-- 盆栽 -->
  <g>
    <polygon points="78,428 96,428 93,444 81,444" fill="#A9714B" stroke="#2E3A45" stroke-width="1.5"/>
    <circle cx="84" cy="422" r="7" fill="#7FA98C"/><circle cx="92" cy="424" r="6" fill="#7FA98C"/>
  </g>
  <g>
    <polygon points="282,430 300,430 297,446 285,446" fill="#A9714B" stroke="#2E3A45" stroke-width="1.5"/>
    <circle cx="288" cy="424" r="7" fill="#7FA98C"/><circle cx="296" cy="426" r="6" fill="#7FA98C"/>
  </g>

  <!-- 水箱 -->
  <rect x="310" y="344" width="5" height="34" fill="#2E3A45"/><rect x="351" y="344" width="5" height="34" fill="#2E3A45"/>
  <rect x="304" y="280" width="56" height="66" rx="6" fill="#5B7B9A" stroke="#2E3A45" stroke-width="2"/>
  <polygon points="300,280 364,280 332,258" fill="#4A5A6A" stroke="#2E3A45" stroke-width="2"/>
  <line x1="304" y1="306" x2="360" y2="306" stroke="#2E3A45" stroke-width="1.5" opacity=".6"/>

  <!-- 串灯（小屋 → 水箱） -->
  <path d="M74,292 Q130,330 190,296 Q250,332 304,288" fill="none" stroke="#2D333D" stroke-width="1.5"/>
  <g fill="#FFD166">
    <circle cx="92" cy="302" r="4.5" opacity=".18"/><circle cx="92" cy="302" r="2.2"/>
    <circle cx="116" cy="312" r="4.5" opacity=".18"/><circle cx="116" cy="312" r="2.2"/>
    <circle cx="142" cy="315" r="4.5" opacity=".18"/><circle cx="142" cy="315" r="2.2"/>
    <circle cx="168" cy="309" r="4.5" opacity=".18"/><circle cx="168" cy="309" r="2.2"/>
    <circle cx="208" cy="302" r="4.5" opacity=".18"/><circle cx="208" cy="302" r="2.2"/>
    <circle cx="232" cy="310" r="4.5" opacity=".18"/><circle cx="232" cy="310" r="2.2"/>
    <circle cx="256" cy="313" r="4.5" opacity=".18"/><circle cx="256" cy="313" r="2.2"/>
    <circle cx="280" cy="303" r="4.5" opacity=".18"/><circle cx="280" cy="303" r="2.2"/>
  </g>
  <text x="14" y="700" font-size="9.5" fill="#9AA4B2" opacity=".6">天台</text>
</svg>
