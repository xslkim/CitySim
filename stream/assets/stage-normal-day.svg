<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" role="img" aria-label="404 公寓剖面：2F 公共厨房日景">
  <!-- T-ITER3-06（R3 #6）normal 形态日景变体：与 stage-normal.svg 同几何，昼夜由 main.js
       按 +08 本地模拟时切换（06:00~19:00 日景）。日景取色仍 ⊆ allowed_hex.txt：
       天空=accent/雾蓝、日轮=杏黄、窗光=公司·白天主色（自然采光）、吊灯/窗灯熄灭。 -->
  <defs>
